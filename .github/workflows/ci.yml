name: CI

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: naughtywolf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache Cargo registry, git, and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: JavaScript tests
        run: node --test tests/*.cjs

      - name: JavaScript syntax
        run: node --check static/callback-workspace.js

      - name: Workflow self-check
        run: python3 tests/workflow_test.py

      - name: Deployment script validation
        run: |
          bash -n deploy/vps/deploy.sh
          bash tests/vps_deploy_test.sh
          docker compose \
            --file docker-compose.yml \
            --file deploy/vps/docker-compose.yml \
            config --quiet

      - name: Build production image
        run: docker build -t naughtywolf:coolify-check .

      - name: Container smoke test
        run: python3 tests/container_smoke.py naughtywolf:coolify-check

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache Cargo registry, git, and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Profile, implant, and console tests
        run: cargo test -p nw-profile -p nw-implant -p nw-console