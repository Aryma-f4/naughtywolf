[package]
name = "naughtywolf"
version = "0.1.0"
edition = "2024"
description = "Sliver Web GUI — authorized operator/admin console"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-bunyan-formatter = "0.3"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
moka = { version = "0.12", features = ["sync"] }
tower-sessions = { version = "0.14", features = ["memory-store", "signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
time = "0.3"
cookie = { version = "0.18", features = ["key-expansion"] }
rpassword = "7"
async-trait = "0.1"
dirs = "5"
anyhow = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lib]
name = "naughtywolf"
path = "src/lib.rs"

[[bin]]
name = "naughtywolf"
path = "src/main.rs"
