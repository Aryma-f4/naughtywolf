[workspace]
resolver = "2"
members = [
    ".",
    "crates/profile",
    "crates/server",
    "crates/implant",
    "crates/console",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
hkdf = "0.12"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
serde_urlencoded = "0.7"
futures = "0.3"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rpassword = "7"
tempfile = "3"
libc = "0.2"

[package]
name = "naughtywolf"
version = "0.1.0"
edition = "2024"
description = "Sliver Web GUI — authorized operator/admin console"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-bunyan-formatter = "0.3"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono.workspace = true
argon2.workspace = true
clap = { version = "4", features = ["derive"] }
thiserror = "2"
moka = { version = "0.12", features = ["sync"] }
tower-sessions = { version = "0.14", features = ["memory-store", "signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
time = "0.3"
cookie = { version = "0.18", features = ["key-expansion"] }
rpassword.workspace = true
async-trait = "0.1"
dirs = "5"
anyhow = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
sha2 = "0.10"
libc.workspace = true
hex.workspace = true
base64 = { version = "0.22", features = ["std"] }
nw-profile = { path = "crates/profile" }
reqwest = { workspace = true, features = ["rustls-tls"] }

[dev-dependencies]
tempfile.workspace = true
nw-implant = { path = "crates/implant" }

[lib]
name = "naughtywolf"
path = "src/lib.rs"

[[bin]]
name = "naughtywolf"
path = "src/main.rs"
